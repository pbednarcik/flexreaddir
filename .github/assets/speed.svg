<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-labelledby="title desc">
  <title id="title">Listing 1,000 files: FlexReadDir against the standard library</title>
  <desc id="desc">Time to list a 1,000-file directory with sizes and times. macOS: os.File.ReadDir plus Info 1,382 microseconds, FlexReadDir 362, 3.8 times faster. Linux in a VM: 603 against 376, 1.6 times. Windows: 164.3 against 131.1, 1.3 times.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #5C2D91; }
    .std { fill: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .accent { fill: #a8b4f8; }
      .std { fill: #3d444d; }
    }
  </style>
  <defs>
    <linearGradient id="flex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B8CF0"/>
      <stop offset="1" stop-color="#5C2D91"/>
    </linearGradient>
  </defs>

  <text class="ink" x="0" y="22" font-size="17" font-weight="600">Listing 1,000 files, with sizes and times</text>
  <text class="muted" x="0" y="42" font-size="13">time, each platform's standard library = 100%; shorter is faster</text>

  <rect class="std" x="0" y="56" width="14" height="14" rx="3"/>
  <text class="muted" x="20" y="68" font-size="13">os.File.ReadDir + Info</text>
  <rect x="190" y="56" width="14" height="14" rx="3" fill="url(#flex)"/>
  <text class="muted" x="210" y="68" font-size="13">FlexReadDir</text>

  <!-- macOS: 1,382 against 362 µs -->
  <text class="ink" x="0" y="113" font-size="15" font-weight="600">macOS</text>
  <rect class="std" x="120" y="88" width="470" height="20" rx="4"/>
  <text class="ink" x="582" y="103" font-size="12" text-anchor="end">1,382 µs</text>
  <rect x="120" y="112" width="123" height="20" rx="4" fill="url(#flex)"/>
  <text class="ink" x="249" y="127" font-size="12">362 µs</text>
  <text class="accent" x="716" y="117" font-size="22" font-weight="700" text-anchor="end">3.8×</text>

  <!-- Linux (VM): 603 against 376 µs -->
  <text class="ink" x="0" y="173" font-size="15" font-weight="600">Linux</text>
  <text class="muted" x="0" y="189" font-size="11">in a VM</text>
  <rect class="std" x="120" y="148" width="470" height="20" rx="4"/>
  <text class="ink" x="582" y="163" font-size="12" text-anchor="end">603 µs</text>
  <rect x="120" y="172" width="293" height="20" rx="4" fill="url(#flex)"/>
  <text class="ink" x="419" y="187" font-size="12">376 µs</text>
  <text class="accent" x="716" y="177" font-size="22" font-weight="700" text-anchor="end">1.6×</text>

  <!-- Windows: 164.3 against 131.1 µs -->
  <text class="ink" x="0" y="233" font-size="15" font-weight="600">Windows</text>
  <rect class="std" x="120" y="208" width="470" height="20" rx="4"/>
  <text class="ink" x="582" y="223" font-size="12" text-anchor="end">164 µs</text>
  <rect x="120" y="232" width="375" height="20" rx="4" fill="url(#flex)"/>
  <text class="ink" x="501" y="247" font-size="12">131 µs</text>
  <text class="accent" x="716" y="237" font-size="22" font-weight="700" text-anchor="end">1.3×</text>
</svg>
